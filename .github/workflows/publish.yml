name: Publish Extension

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'EthanSK/vscode-icons-plus-plus' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run package:vsix
      - name: Publish and verify the exact package
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          version=$(node -p 'require("./package.json").version')
          package_file="vscode-icons-plus-plus-${version}.vsix"
          npx --no-install vsce publish --packagePath "$package_file"
          npm run verify:marketplace -- --vsix "$package_file"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          package_file="vscode-icons-plus-plus-${version}.vsix"
          sha256sum "$package_file" > SHA256SUMS
          gh release create "v${version}" "$package_file" SHA256SUMS --target "$GITHUB_SHA" --title "VS Code Icons++ ${version}" --generate-notes
